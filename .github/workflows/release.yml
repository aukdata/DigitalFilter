name: Release

# Pushing a tag like v1.3.0 builds the mod with that version and publishes a GitHub Release with the jar attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/libs/digitalfilter-1.20.1-${GITHUB_REF_NAME#v}.jar" \
            --title "$GITHUB_REF_NAME" --generate-notes
