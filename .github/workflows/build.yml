name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: digitalfilter
          path: build/libs/*.jar
